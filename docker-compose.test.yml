services:
  postgres_test:
    # IC-01: pgvector required by schema (DocumentChunk.embedding vector column)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aqliya_test
      POSTGRES_PASSWORD: aqliya_test
      POSTGRES_DB: aqliya_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
