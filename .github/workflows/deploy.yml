name: AQLIYA Deploy

# ── Deploy Gate ─────────────────────────────────────────────
# Deploy now runs only after CI completes successfully on main.
# Manual workflow_dispatch bypasses the gate for emergency deploys.
# ────────────────────────────────────────────────────────────
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'aqliya/prod/app' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'aqliya-prod-cluster' }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE || 'aqliya-prod-service' }}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    # Gate: automated runs require CI success; manual dispatch always allowed
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & tag image
        run: |
          docker build -t $ECR_REPOSITORY:${{ github.sha }} .
          docker tag $ECR_REPOSITORY:${{ github.sha }} $ECR_REPOSITORY:latest

      - name: Push to ECR
        run: |
          docker push $ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REPOSITORY:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment

      - name: Wait for service stable
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE

      - name: Smoke test
        env:
          BASE_URL: ${{ vars.DEPLOY_BASE_URL || 'https://app.aqliya.com' }}
        run: |
          sleep 10
          curl -sf "${{ env.BASE_URL }}/api/platform/health" | jq '.status' | grep ok
          curl -sf "${{ env.BASE_URL }}/" > /dev/null
          curl -sf "${{ env.BASE_URL }}/login" > /dev/null