name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        # IC-01: pgvector required for DocumentChunk embedding columns in schema
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aqliya_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/aqliya_ci
      AUTH_SECRET: ci-auth-secret-minimum-32-characters
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Documentation validation
        run: |
          echo "::group::Validate knowledge-map"
          node scripts/validate-documentation.mjs
          echo "::endgroup::"
          echo "::group::Check document links"
          node scripts/check-document-links.mjs
          echo "::endgroup::"
          echo "::group::Find orphan documents"
          node scripts/find-orphan-documents.mjs
          echo "::endgroup::"
          echo "::group::Lint documentation"
          node scripts/lint-documentation.mjs
          echo "::endgroup::"
          echo "::group::Validate AI consistency"
          node scripts/validate-ai-consistency.mjs
          echo "::endgroup::"
          echo "::group::Validate metadata"
          node scripts/validate-metadata.mjs
          echo "::endgroup::"
          echo "::group::Validate reading orders"
          node scripts/validate-reading-orders.mjs
          echo "::endgroup::"

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to CI database
        run: |
          PGPASSWORD=ci psql -h localhost -U ci -d aqliya_ci -c "CREATE EXTENSION IF NOT EXISTS vector;"
          npx prisma migrate deploy
          npx prisma migrate status
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/aqliya_ci

      - name: Type-check
        run: npx tsc --noEmit
        env:
          NODE_ENV: development

      - name: Unit + integration tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: License compliance check
        run: npx license-checker --failOn "GPL;AGPL;LGPL-3.0" --production --summary
        continue-on-error: true

      - name: Dependency audit (fail on high)
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: npm audit --audit-level=high

      - name: Secret scanning (gitleaks)
        if: always()
        continue-on-error: true
        run: |
          GITLEAKS_VERSION="8.18.2"
          GITLEAKS_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sL "$GITLEAKS_URL" -o /tmp/gitleaks.tar.gz && \
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp && \
          /tmp/gitleaks detect --source . --config .gitleaks.toml --no-git --verbose
